name: Domain Renewal
on:
  schedule:
    - cron: '0 15 1 * *' # 每月 1 号北京时间 23:15 运行
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Install Playwright and dependencies
        run: |
          python -m playwright install --with-deps chromium
          python -m playwright install chrome

      - name: Run renew script
        run: python renew.py
        env:
          DP_EMAIL: ${{ secrets.DP_EMAIL }}
          DP_PASSWORD: ${{ secrets.DP_PASSWORD }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}

      - name: Check Month Condition
        id: check_month
        run: |
          MONTH=$(date +%m)
          if [ $((MONTH % 2)) -eq 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "send_mail=true" >> $GITHUB_OUTPUT
          else
            echo "send_mail=false" >> $GITHUB_OUTPUT
          fi

      - name: Read and Format Results
        id: read_result
        run: |
          python - <<'EOF'
          import json, os
          try:
              with open('renewal_results.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              lines = []
              total = data.get('renewed_count', 0) + data.get('failed_count', 0)
              lines.append(f"本次共检查 {total} 个域名：\n")
              
              # 处理成功的域名
              if data.get('renewed_count', 0) > 0:
                  lines.append("✅ 续期成功：")
                  for domain in data.get('renewed_domains', []):
                      lines.append(f"  - {domain}")
                  lines.append("")
                  
              # 处理未成功或跳过的域名
              if data.get('failed_count', 0) > 0:
                  lines.append("⏳ 检查结果（未执行续期）：")
                  for item in data.get('failed_domains', []):
                      # 提取域名名称 (原版格式通常是 "域名 (续期失败: {...})")
                      domain_name = item.split(' ')[0]
                      
                      if "fewer than 120 days" in item or "120 天" in item:
                          lines.append(f"  - {domain_name}")
                          lines.append(f"    ★ 状态：正常跳过。原因：距到期时间大于 120 天，官方暂不允许免费续期。")
                      else:
                          # 清洗掉丑陋的 JSON 符号，并翻译常见错误
                          error_msg = item.replace('{"error":"', '').replace('"}', '').replace('"}))', '')
                          error_msg = error_msg.replace('Free renewal is available only when fewer than 120 days remain before expiration. You can renew earlier with c', '')
                          lines.append(f"  - {domain_name}")
                          lines.append(f"    ★ 状态：❌ 发生错误。原因：{error_msg.strip()}")
              body = "\n".join(lines)
          except Exception:
              body = "未能解析详细报告，请点击下方链接查看日志。"
          
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"MAIL_BODY<<EOF\n{body}\nEOF\n")
          EOF

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        if: steps.check_month.outputs.send_mail == 'true'
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: DPDNS 自动续期结果 - ${{ job.status }}
          to: ${{ secrets.TO_EMAIL }}
          from: GitHub Actions
          body: |
            续期工作流已完成，当前状态：${{ job.status }}
            
            ==============================
            ${{ env.MAIL_BODY }}
            ==============================
            
            查看详细原始日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
