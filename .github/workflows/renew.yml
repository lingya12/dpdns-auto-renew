name: Domain Renewal
on:
  schedule:
    - cron: '0 15 1 * *' # 每月 1 号北京时间 23:15 运行
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          
      - name: Install Playwright and dependencies
        run: |
          python -m playwright install --with-deps chromium
          python -m playwright install chrome

      - name: Run renew script
        run: python renew.py
        env:
          DP_EMAIL: ${{ secrets.DP_EMAIL }}
          DP_PASSWORD: ${{ secrets.DP_PASSWORD }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}

      - name: Check Month Condition
        id: check_month
        run: |
          MONTH=$(date +%m)
          if [ $((MONTH % 2)) -eq 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "send_mail=true" >> $GITHUB_OUTPUT
          else
            echo "send_mail=false" >> $GITHUB_OUTPUT
          fi

      - name: Read and Format Results
        id: read_result
        run: |
          python - <<'EOF'
          import json, os
          import urllib.request
          
          body_lines = []
          
          # 1. 查询 2captcha 余额（静默查询，不足才报警）
          api_key = os.environ.get('CAPTCHA_API_KEY')
          try:
              url = f"https://2captcha.com/res.php?key={api_key}&action=getbalance&json=1"
              req = urllib.request.urlopen(url, timeout=10)
              res_data = json.loads(req.read().decode('utf-8'))
              if res_data.get("status") == 1:
                  balance = float(res_data.get("request", 0))
                  # 预警线设为 0.5 美元（约够跑 300 次）
                  if balance < 0.5:
                      body_lines.append(f"⚠️ 【注意】2captcha 余额不足（仅剩 ${balance:.3f}），即将耗尽，请尽快充值！")
                      body_lines.append("==============================\n")
          except Exception:
              pass # 如果查询接口出错，不影响正常发信
          
          # 2. 解析续期结果
          try:
              with open('renewal_results.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              total = data.get('renewed_count', 0) + data.get('failed_count', 0)
              body_lines.append(f"本次共检查 {total} 个域名：\n")
              
              if data.get('renewed_count', 0) > 0:
                  body_lines.append("✅ 续期成功：")
                  for domain in data.get('renewed_domains', []):
                      body_lines.append(f"  - {domain}")
                  body_lines.append("")
                  
              if data.get('failed_count', 0) > 0:
                  body_lines.append("⏳ 检查结果（未执行续期）：")
                  for item in data.get('failed_domains', []):
                      domain_name = item.split(' ')[0]
                      if "fewer than 120 days" in item or "120 天" in item:
                          body_lines.append(f"  - {domain_name}")
                          body_lines.append(f"    ★ 状态：正常跳过。原因：距到期时间大于 120 天，官方暂不允许免费续期。")
                      else:
                          error_msg = item.replace('{"error":"', '').replace('"}', '').replace('"}))', '')
                          error_msg = error_msg.replace('Free renewal is available only when fewer than 120 days remain before expiration. You can renew earlier with c', '')
                          body_lines.append(f"  - {domain_name}")
                          body_lines.append(f"    ★ 状态：❌ 发生错误。原因：{error_msg.strip()}")
          except Exception:
              body_lines.append("未能解析详细报告，请点击下方链接查看日志。")
              
          final_body = "\n".join(body_lines)
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"MAIL_BODY<<EOF\n{final_body}\nEOF\n")
          EOF
        env:
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        if: steps.check_month.outputs.send_mail == 'true'
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: DPDNS 自动续期结果 - ${{ job.status }}
          to: ${{ secrets.TO_EMAIL }}
          from: GitHub Actions
          body: |
            续期工作流已完成，当前状态：${{ job.status }}
            
            ==============================
            ${{ env.MAIL_BODY }}
            ==============================
            
            查看详细原始日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
