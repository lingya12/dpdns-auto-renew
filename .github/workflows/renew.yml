name: Domain Renewal
on:
  schedule:
    - cron: '0 15 1 * *'  # 每月15日 北京时间9:15 (UTC 1:15) 运行一次
  workflow_dispatch:  # 允许手动触发
jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'  # 使用稳定的 Python 版本

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2t64

      - name: Clear Playwright cache
        run: |
          rm -rf /home/runner/.cache/ms-playwright

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade playwright requests

      - name: Install Google Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          google-chrome --version

      - name: Verify Playwright installation
        run: |
          python -m playwright --version
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(channel='chrome'); print('chrome launch OK', b.version); b.close(); p.stop()"

      - name: Run renew script
        run: python renew.py
        env:
          DP_EMAIL: ${{ secrets.DP_EMAIL }}
          DP_PASSWORD: ${{ secrets.DP_PASSWORD }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}
      - name: 检查是否需要发邮件
        id: check_month
        run: |
          MONTH=$(date +%m)
          if [ $((MONTH % 2)) -eq 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "send_mail=true" >> $GITHUB_OUTPUT
          else
            echo "send_mail=false" >> $GITHUB_OUTPUT
          fi

      - name: 读取详细结果
        id: read_result
        run: |
          if [ -f renewal_results.json ]; then
            echo "MAIL_BODY<<EOF" >> $GITHUB_ENV
            cat renewal_results.json >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          else
            echo "MAIL_BODY<<EOF" >> $GITHUB_ENV
            echo "未找到详细日志文件，请点击下方链接查看。" >> $GITHUB_ENV
            echo "EOF" >> $GITHUB_ENV
          fi

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        if: steps.check_month.outputs.send_mail == 'true'
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: DPDNS 自动续期结果 - ${{ job.status }}
          to: ${{ secrets.TO_EMAIL }}
          from: GitHub Actions
          body: |
            续期工作流已完成，当前状态：${{ job.status }}
            
            以下是具体执行结果：
            ${{ env.MAIL_BODY }}
            
            查看详情（可选）：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}     
