name: Domain Renewal
on:
  schedule:
    - cron: '0 15 1 * *' # 每月 1 号北京时间 23:15 运行
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libatk1.0-0 libatk-bridge2.0-0 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt

      - name: Install Google Chrome
        run: |
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Verify Playwright installation
        run: |
          python -m playwright --version
          python -c "from playwright.sync_api import sync_playwright; p = sync_playwright().start(); b = p.chromium.launch(channel='chrome'); b.close(); p.stop()"

      - name: Run renew script
        run: python renew.py
        env:
          DP_EMAIL: ${{ secrets.DP_EMAIL }}
          DP_PASSWORD: ${{ secrets.DP_PASSWORD }}
          BARK_KEY: ${{ secrets.BARK_KEY }}
          BARK_SERVER: ${{ secrets.BARK_SERVER }}
          CAPTCHA_API_KEY: ${{ secrets.CAPTCHA_API_KEY }}

      - name: Check Month Condition
        id: check_month
        run: |
          MONTH=$(date +%m)
          if [ $((MONTH % 2)) -eq 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "send_mail=true" >> $GITHUB_OUTPUT
          else
            echo "send_mail=false" >> $GITHUB_OUTPUT
          fi

      - name: Read Results
        id: read_result
        run: |
          if [ -f renewal_results.json ]; then
            RESULT=$(tr -d '\n' < renewal_results.json)
            echo "MAIL_BODY=$RESULT" >> $GITHUB_ENV
          else
            echo "MAIL_BODY=未找到详细报告，请点击链接查看日志。" >> $GITHUB_ENV
          fi

      - name: Send Email Notification
        uses: dawidd6/action-send-mail@v3
        if: steps.check_month.outputs.send_mail == 'true'
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: DPDNS 自动续期结果 - ${{ job.status }}
          to: ${{ secrets.TO_EMAIL }}
          from: GitHub Actions
          body: |
            续期工作流已完成，当前状态：${{ job.status }}
            
            以下是详细执行结果：
            ${{ env.MAIL_BODY }}
            
            查看详细日志（点击下方链接）：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
